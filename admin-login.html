<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Fresh Wave</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0d2b1e, #2e8b57);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 25px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            text-align: center;
        }
        .login-logo img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
        }
        h1 {
            color: #2e8b57;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .input-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
        }
        .input-group input:focus {
            outline: none;
            border-color: #2e8b57;
        }
        .login-btn {
            background: #2e8b57;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .login-btn:hover {
            background: #1e5a3a;
        }
        .error-msg {
            background: #ffebee;
            color: #d32f2f;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #2e8b57;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo">
            <img src="Fresh logo.jpg" alt="Fresh Wave Logo" onerror="this.src='https://placehold.co/80x80/2e8b57/white?text=FW'">
        </div>
        <h1><i class="fas fa-chalkboard-user"></i> Admin Login</h1>
        <p class="subtitle">Enter your credentials</p>
        
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="adminUsername" placeholder="Enter username">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="adminPassword" placeholder="Enter password">
        </div>
        
        <button class="login-btn" onclick="adminLogin()">Login</button>
        <div id="loginError"></div>
        
        <a href="index.html" class="back-link">← Back to Shop</a>
    </div>

    <script>
        const ADMIN_USERNAME = "freshwaveadmin";
        const ADMIN_PASSWORD = "12345678";
        
        function adminLogin() {
            const username = document.getElementById('adminUsername').value.trim();
            const password = document.getElementById('adminPassword').value;
            
            if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                sessionStorage.setItem('adminLoggedIn', 'true');
                sessionStorage.setItem('adminUsername', username);
                window.location.href = 'admin-dashboard.html';
            } else {
                document.getElementById('loginError').innerHTML = '<div class="error-msg"><i class="fas fa-exclamation-circle"></i> Invalid username or password</div>';
            }
        }
        
        if (sessionStorage.getItem('adminLoggedIn') === 'true') {
            window.location.href = 'admin-dashboard.html';
        }
        
        document.getElementById('adminPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') adminLogin();
        });
    </script>
</body>
</html>
